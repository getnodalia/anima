[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
# 0.1.0 is the early alpha (release stage in src/app.rs, RELEASE_STAGE); see CHANGELOG.md
# and docs/release.md.
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
# An application, not a library: not published to crates.io.
publish = false
repository = "https://github.com/getnodalia/anima"
rust-version = "1.95"

[workspace.dependencies]
nodalia-video = { git = "https://github.com/getnodalia/foundation", rev = "c91e7e5d2081e94a5c8ac48e48ab00008a1842e7", default-features = false, features = ["screen-video"] }
nodalia-palette = { git = "https://github.com/getnodalia/foundation", rev = "d6ba152de9691955180f2938502ddbd010ef45ea" }
nodalia-lottie = { git = "https://github.com/getnodalia/foundation", rev = "5cbd1543e9c006064904465d2503bbd223e7e3a6" }
anima-geom = { path = "crates/geom" }
anima-doc = { path = "crates/doc" }
anima-render = { path = "crates/render" }
anima-engine = { path = "crates/engine" }
anima-xfl = { path = "crates/xfl" }
anima-xml = { path = "crates/xml" }
anima-svg = { path = "crates/svg" }
anima-text = { path = "crates/text" }
anima-plugins = { path = "crates/plugins" }
anima-audio = { path = "crates/audio" }
anima-gpu = { path = "crates/gpu" }
anima-guide = { path = "crates/guide" }
nodalia-anima-format = { git = "https://github.com/getnodalia/foundation", rev = "7d584fd1c6d974f2728edf467a9582f923c1cf13" }
nodalia-mime = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "7d584fd1c6d974f2728edf467a9582f923c1cf13" }
nodalia-html = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "7d584fd1c6d974f2728edf467a9582f923c1cf13", default-features = false }
nodalia-audio = { git = "https://github.com/getnodalia/foundation", rev = "b0128030e39b29167ff747cc2225dfabeb99160f", default-features = false, features = ["decode", "pcm-encode"] }
nodalia-gif = { git = "https://github.com/getnodalia/foundation", rev = "7d584fd1c6d974f2728edf467a9582f923c1cf13" }
# Isolate the already-merged APNG container from the existing raster-codec pin.
nodalia-apng-container = { package = "nodalia-image-codecs", version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "4199c47f5dc9f8dac749c4609a8aa132219036b1", default-features = false }
nodalia-image-codecs = { git = "https://github.com/getnodalia/foundation", rev = "7d584fd1c6d974f2728edf467a9582f923c1cf13" }
nodalia-webp = { git = "https://github.com/getnodalia/foundation", rev = "5fecd8b44f86c7cf801944d5ea4142f16f1fe747" }
nodalia-xfl = { git = "https://github.com/getnodalia/foundation", rev = "0a1aedecb96656dd966f7bd88fd49ddd3a70e2e4" }
nodalia-xml = { git = "https://github.com/getnodalia/foundation", rev = "0a1aedecb96656dd966f7bd88fd49ddd3a70e2e4" }
# The GPU stage (ADR 0019) uses the wgpu that eframe's egui-wgpu brings, with the same
# (default) features, so the tree keeps one wgpu build.
wgpu = "30"
# The WGSL front end wgpu already builds, for checking the shaders in tests.
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
bytemuck = "1"
anima-actions = { path = "crates/actions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
# Unions of flattened polygons on an integer grid, for a stroke's outline (ADR 0110): pure
# Rust, no unsafe in our use, MIT OR Apache-2.0 (its i_float, i_shape, i_tree and i_key_sort: MIT).
i_overlay = { version = "9.2", default-features = false }
# wgpu is the primary renderer; glow (OpenGL) is the fallback for GPUs/VMs where wgpu fails.
# Default features off: we skip `links` (opening web links pulls in url/idna/ICU Unicode
# tables we don't use) and the web-only screen-reader shim. Same set as PhotoCraft, plus glow.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
# Native file dialogs: Windows common dialogs, macOS NSOpenPanel, Linux XDG desktop portal.
rfd = "0.17"
# Lists and loads the OS's installed fonts for Preferences › Appearance (MIT).
# Without the `fontconfig` feature, Linux scans the standard font folders directly
# (/usr/share/fonts, /usr/local/share/fonts, ~/.local/share/fonts, ~/.fonts).
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
egui = "0.37"
# `Instant` and `SystemTime` that work in the browser too (std's panic on wasm32-unknown-unknown);
# on other targets a re-export of std::time (MIT OR Apache-2.0; already in the tree via winit).
web-time = "1"
# Find and Replace's pattern matching (ADR 0058): linear time, with size limits on what a
# pattern compiles to (MIT OR Apache-2.0). Unicode case folding and word boundaries only.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[package]
name = "anima"
description = "Ánima desktop app: egui shell over the Ánima engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
default-run = "anima"

[features]
# Plays sound during stage playback. Off: playback is silent (for builders without ALSA headers).
default = ["sound-output", "gpu-stage"]
sound-output = ["dep:cpal"]
# GPU stage renderer (ADR 0019, 0029, 0031), on by default: the stage draws on the graphics card
# when there is a usable one, and on the CPU (the oracle, and what exports use) otherwise and
# for anything the GPU can't draw. Preferences › Stage › Renderer can choose the CPU. Build with
# `--no-default-features --features sound-output` for a CPU-only shell.
gpu-stage = ["dep:anima-gpu"]

[[bin]]
name = "anima"
path = "src/main.rs"

[dependencies]
anima-geom.workspace = true
anima-doc.workspace = true
anima-render.workspace = true
anima-engine.workspace = true
anima-gpu = { workspace = true, optional = true }
egui.workspace = true
serde.workspace = true
fontdb.workspace = true
anima-audio.workspace = true
serde_json.workspace = true
web-time.workspace = true
# The system's interface language, for the default language (ADR 0040; MIT OR Apache-2.0).
sys-locale = "0.3"
# The Nodalia Design Language (MIT): palette, creator-suite parts, icons and window controls.
nodalia-theme = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "07e63775aca14bc13f98e72e3c67be978f2f7fc3", features = ["creator"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The user guide, bundled for Help › User Guide (ADR 0069). The web build serves it as pages instead.
anima-guide.workspace = true
# The live control port and the tools it serves (ADR 0104): the same dispatcher as the
# headless MCP server, so live and headless never drift.
anima-cli = { path = "crates/cli" }
# Release checks and in-place updates, shared by the Nodalia apps (MIT). Without its egui windows:
# Ánima draws its own with the egui it already uses.
nodalia-update = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "114848a2ff1a7c29c9a5432fb12e955fbe0aeef2" }

eframe = { workspace = true, features = ["links"] }
rfd.workspace = true
# Pictures copied in other apps, for Paste (#263). The clipboard library eframe already uses
# for text (MIT OR Apache-2.0), with the same features, so no crate is added to the build.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Sound output (Apache-2.0): WASAPI on Windows, CoreAudio on macOS, ALSA on Linux and the BSDs.
cpal = { version = "0.18", optional = true }

# macOS hands a double-clicked document to the app as an Apple Event, which winit 0.30 doesn't
# deliver (ADR 0062). This small crate (MIT OR Apache-2.0, ~170 lines, read in full) registers the
# open-documents and quit handlers with AppKit and hands us plain paths, so our code stays free of
# `unsafe`. Pinned exactly: it is young, and a new version is read again before it comes in. Its
# objc2 / objc2-app-kit / objc2-foundation are the versions wgpu already brings on macOS.
# The global menu (dbusmenu over the session bus) on Linux desktops with a top-bar menu. The zbus
# the portal file dialogs (rfd) and accesskit already bring (MIT).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"

# The system's high-contrast setting (ADR 0064): one registry value. MIT.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# The web build (ADR 0036, docs/web.md). The window draws with WebGL2 (glow): every current
# browser has it, the stage is drawn on the CPU there, and leaving wgpu out keeps the download
# smaller. The browser glue is wasm-bindgen's (MIT OR Apache-2.0), already under eframe's web
# backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Sound output in the browser (ADR 0095): cpal's Web Audio host, on the wasm-bindgen glue above
# (Apache-2.0). The AudioContext opens on the first play, which is a click, as browsers ask.
cpal = { version = "0.18", optional = true, features = ["wasm-bindgen"] }
# In the browser the page's language (navigator.languages) is the system's.
sys-locale = { version = "0.3", features = ["js"] }
web-sys = { version = "0.3", features = ["BeforeUnloadEvent", "Blob", "BlobPropertyBag", "CssStyleDeclaration", "DomRect", "DragEvent", "Document", "Element", "Event", "EventTarget", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "MediaQueryList", "Navigator", "Storage", "Url", "Window", "console"] }

[dev-dependencies]
# Plug-in fixtures for the shell's plug-in tests, in WebAssembly text (Apache-2.0 WITH
# LLVM-exception; already in the tree for the engine's tests).
wat = "1.228"

[build-dependencies]
# Embeds the app icon in anima.exe on Windows (build.rs); does nothing on other targets.
winresource = "0.1"

[lints]
workspace = true

# ----- build profiles: biased for disk space, then time (docs/development.md › Build footprint) --

[profile.dev]
opt-level = 1
# File:line in backtraces and panics, without full variable debug info (a fraction of the size;
# also keeps Windows PDBs under the LNK1140 limit).
debug = "line-tables-only"
# The incremental cache was ~3 GB for our crates; they rebuild from scratch in seconds.
incremental = false

[profile.dev.package."*"]
# Dependencies: optimized once (fast app in debug builds), no debug info at all.
opt-level = 2
debug = false

[profile.dev.build-override]
# Build scripts and proc-macros: compile fast, no debug info.
opt-level = 0
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.web]
# The web editor (scripts/build-web.sh, ADR 0036): the release build optimized for size, since
# the browser downloads and compiles the whole module before anything shows (9.1 MB, 3.3 MB
# gzipped, against 11.3 / 4.0 MB at opt-level 3), and without the symbol names.
inherits = "release"
opt-level = "s"
strip = true

# ...except the CPU renderer and the geometry under it, which draw the stage there on one thread.
[profile.web.package.anima-render]
opt-level = 3

[profile.web.package.anima-geom]
opt-level = 3
