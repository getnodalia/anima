[package]
name = "anima-engine"
description = "Ánima L3: session, undo history, command registry and the .anima file format"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anima-geom.workspace = true
anima-doc.workspace = true
anima-render.workspace = true
anima-xfl.workspace = true
anima-svg.workspace = true
anima-text.workspace = true
anima-plugins.workspace = true
craft-anicraft-format.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
web-time.workspace = true
craft-gif.workspace = true
craft-image-codecs.workspace = true
craft-apng-container.workspace = true
craft-webp.workspace = true
regex.workspace = true

[dev-dependencies]
# Packs the XFL corpus into .fla archives in tests (ADR 0054; already in the tree through xfl).
miniz_oxide = "0.8"
# Plug-in test fixtures written in WebAssembly text (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

# Runs tests/wasm.rs inside WebAssembly, in Node (ADR 0036; MIT OR Apache-2.0).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
