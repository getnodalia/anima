[package]
name = "anima-cli"
description = "Ánima L4: headless CLI, MCP server and the desktop app's live control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "anima-cli"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anima-doc.workspace = true
anima-engine.workspace = true
anima-render.workspace = true
anima-geom.workspace = true
anima-guide.workspace = true
serde_json.workspace = true

# The live control port's per-run token (ADR 0104): the operating system's random numbers.
# MIT OR Apache-2.0, already in the tree. Not for the web: a page has no sockets, so the control
# port (and `mcp --bridge`) is left out of wasm32 builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[dev-dependencies]
# Exporter plug-in fixtures written in WebAssembly text (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

[lints]
workspace = true
