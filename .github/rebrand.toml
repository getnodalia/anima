[[replace]]
from = "getartcraft.com/apps/anicraft"
to = "getnodalia.com/anima"

[[replace]]
from = "getartcraft.com"
to = "getnodalia.com"

# The install folder is ASCII, like the registry key the updater reads.
[[replace]]
from = "ArtCraft\\AniCraft"
to = "Nodalia\\Anima"

[[replace]]
from = "ArtCraft/AniCraft"
to = "Nodalia/Anima"

# The family the app belongs to: install folders, the About box.
[[replace]]
from = "ArtCraft"
to = "Nodalia"

# Names that end up in paths, bundle folders, registry keys and identifiers: plain ASCII.
# The registry key the installer writes and the updater reads (`Software\<name>`): ASCII.
[[replace]]
from = "Software\\AniCraft"
to = "Software\\Anima"

[[replace]]
from = "Software\\\\AniCraft"
to = "Software\\\\Anima"

# The macOS bundle's executable and icon file names (Info.plist): ASCII, like the bundle.
[[replace]]
from = "<string>AniCraft</string>"
to = "<string>Anima</string>"

[[replace]]
