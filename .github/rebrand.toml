# What `scripts/rebrand.py` renames: upstream's AniCraft becomes Ánima, in file contents and in
# paths. The weekly upstream sync applies the same rules to upstream's tree before merging it, so
# a rule added here applies to everything upstream sends from then on.
#
# Replacements are literal and case-sensitive, applied in order: put the longer, more specific
# ones first. Keep spans are found before any replacement, so a replacement never reaches inside
# one. The product is written "Ánima" wherever people read it; names that end up in file paths,
# bundle folders, registry keys and identifiers use the plain ASCII "Anima"/"anima".

# Left as they are wherever they appear (in file contents and in paths).
keep = [
    # Links to upstream's issues, pull requests and commits, and to other people's repositories:
    # history, not branding. Links to upstream's tree and repository page are renamed below.
    "(https?://)?github\\.com/storytold/[\\w.-]+/(issues|pull|commit|discussions)/[^\\s)\\]\"'<>`]*",
    "https?://(github\\.com|raw\\.githubusercontent\\.com)/(?!storytold/(anicraft|AniCraft|craft-fonts|craft-i18n|craft-libs)\\b|getnodalia|danielmigueltejedor)[^\\s)\\]\"'<>`]*",
    # A Cargo [patch] names the source it overrides, which other crates still point at.
    "\\[patch\\.\"https://github\\.com/storytold/[^\"]+\"\\]",
    # Upstream's issues named without a link (`storytold/anicraft#123`).
    "storytold/[\\w.-]+#\\d+",
    # Upstream's repository in the sync workflow and in the record of what came from it.
    "(?<=UPSTREAM_REPO: )storytold/anicraft",
    # The shared document-format library in getnodalia/foundation keeps its own crate name.
    "craft[-_]anicraft[-_]format",
    # The native file's signature, which every saved document carries (`"format": "anicraft"`).
    # Renaming it would make every existing document unreadable.
    'format\\?"\s?:\s?\\?"anicraft(?=\\?")',
    'an \.anicraft envelope',
    # The module WebAssembly plug-ins import their host calls from. Plug-ins built for AniCraft
    # keep loading, so the name is part of the plug-in API.
    '\(import "anicraft"',
    'IMPORT_MODULE: &str = "anicraft"',
    'anicraft\.(call|response|memory|open_file)\b',
    'wasm_import_module = "anicraft"',
    # Documents saved before the rename keep opening: `.anicraft` stays a known extension (see
    # `anima_engine::format::LEGACY_EXTENSION`), and the file associations keep claiming it.
    "LEGACY_EXTENSION: &str = \"anicraft\"",
    # Credit for work done upstream.
    "AniCraft contributors",
    "ArtCraft Team",
]

# Files left alone entirely.
skip = [
    ".github/rebrand.toml",
    "scripts/rebrand.py",
    # Licence notices keep upstream's copyright line, which the licences require.
    "NOTICE",
    "LICENSE-*",
    "licenses/*",
    # The record of what came from upstream, and upstream's own README kept for reference.
    "docs/upstream.md",
    "docs/upstream-readme.md",
    "NODALIA_MIGRATION.md",
    # Ánima's own installer inventory (JSON has no comments for a `rebrand: keep`): it lists the
    # older `.anicraft` documents next to `.anima`, and `.github/upstream-keep` keeps it ours.
    "packaging/windows/install-policy.json",
    # Binary Finder layout of the disk image: rebuilt by its own script.
    "*.DS_Store",
]

# Run after renaming: shorter names change how rustfmt wraps lines and sorts imports.
after = [["cargo", "fmt", "--all"]]

# Lines that keep this app's value when upstream's tree is rebranded (the sync passes --pin-from).
[[pin]]
file = "Cargo.toml"
pattern = '^version = "[^"]*"'

# Identity: app id, publisher, installer identities (a product of its own, never AniCraft's).
