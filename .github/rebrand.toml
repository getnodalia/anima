# Where the app lives: its repository, releases, container images and web page.
[[replace]]
from = "ghcr.io/storytold/anicraft"
to = "ghcr.io/getnodalia/anima"

[[replace]]
from = "storytold/AniCraft"
to = "getnodalia/anima"

[[replace]]
from = "storytold/anicraft"
to = "getnodalia/anima"

[[replace]]
