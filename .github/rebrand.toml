to = "dev.danielmiguelt.anima.fla"

[[replace]]
from = "ai.storyteller.anicraft.xfl"
to = "dev.danielmiguelt.anima.xfl"

[[replace]]
from = "ai.storyteller.anicraft"
to = "dev.danielmiguelt.Anima"

[[replace]]
from = "AniCraft maintainers <anicraft@storyteller.ai>"
to = "Nodalia <https://github.com/getnodalia/anima/issues>"

[[replace]]
from = "<developer id=\"ai.storyteller\">"
to = "<developer id=\"dev.danielmiguelt\">"

[[replace]]
from = "Learning Machines LLC"
to = "Nodalia"

[[replace]]
from = "95D4D208-47EF-42CD-9127-28D9A7BA88A2"
to = "507CD152-9AD3-4F22-92A7-F8C44F1F84D0"

