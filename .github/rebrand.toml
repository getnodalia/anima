to = "policy[\"name\"], \"Anima\""

[[replace]]
from = "p.join(\"AniCraft\")"
to = "p.join(\"Anima\")"

[[replace]]
from = "AppData/Roaming/AniCraft"
to = "AppData/Roaming/Anima"

# eframe's app name names the folder egui keeps window state in.
[[replace]]
