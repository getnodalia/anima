to = "Anima-"

[[replace]]
from = "MacOS/AniCraft"
to = "MacOS/Anima"

[[replace]]
from = "VOLUME = \"AniCraft\""
to = "VOLUME = \"Anima\""

[[replace]]
from = "-hfs-volume-name \"AniCraft\""
to = "-hfs-volume-name \"Anima\""

[[replace]]
from = "Directory Id=\"INSTALLFOLDER\" Name=\"AniCraft\""
to = "Directory Id=\"INSTALLFOLDER\" Name=\"Anima\""

[[replace]]
from = "\"name\": \"AniCraft\""
to = "\"name\": \"Anima\""

[[replace]]
