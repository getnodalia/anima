name: CI

# Quality gates for every push to main and every pull request, through the reusable Rust gate in
# getnodalia/foundation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@c0d77c11d649cd5293834a544ef18031270d4d54 # foundation main
    with:
      # Same nodalia-fonts commit as freebsd.yml and the release-*.yml workflows.
      fonts-repository: getnodalia/foundation
      fonts-ref: b91919f28edcf74c9e10583110460b79b2385cae
      # mesa-vulkan-drivers: lavapipe, a software Vulkan adapter, so the GPU stage's parity
      # tests run against the CPU oracle on runners without a graphics card (ADR 0031).
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev libasound2-dev mesa-vulkan-drivers
      targets: ""
      tools: ""
      command: |
        cargo fmt --all -- --check
        cargo test --workspace --locked
        cargo clippy --workspace --all-targets --locked -- -D warnings

  # Every git dependency in Cargo.lock comes from getnodalia or nodalia-design.
  git-sources:
    name: git-sources
    uses: getnodalia/foundation/.github/workflows/git-sources.yml@4debdfe28cf5820d1748864efbd8d6996922d1ac # foundation main
